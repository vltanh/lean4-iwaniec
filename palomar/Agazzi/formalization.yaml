    - method: "agent"
      models: ["Claude Opus 5.5 (claude-opus-5-5)"]
      framework: "Claude Code 2.1.330 (Claude Agent SDK)"
      tool_setup: "The formalize-math-paper skill (github.com/vltanh/formalize-math-paper). First round: a lead agent and ten sub-agents (statement review, seven provers in parallel, proof review, cleanup), each checking files against a private snapshot of the build, and one sub-agent that reviewed the documents. A second round (the planar proof of the upper bound, general code moved into the packages): the main session, a lead agent and six sub-agents, one per package task. A third round (the Hessian case, the uniqueness of the projection, Astala's theorem; Sobolev spaces and the Beltrami equation in the packages): the main session, a lead agent and six sub-agents, five provers and one statement reviewer."
      cost:
        wall_time: "about 1.6 hours elapsed from the start to the verified build, and about 4.9 hours of sub-agent time; second round, about 1.7 hours elapsed and 1.2 hours of sub-agent time; third round, about 1.7 hours elapsed and 1.3 hours of sub-agent time (session transcripts)"
