status:
  scope: >-
    Every numbered result of the paper is formalized and proved: Lemma 3, Lemma 4, Theorem 1
    (also for Lipschitz periodic test maps), Corollary 2 (both assertions), and the cited
    results that the paper uses: the projection of Kinderlehrer–Stampacchia, the identities, the
    inequality and remark (b) of Baernstein–Montgomery-Smith, Guerra's Theorem 1.1 and Lehto's
    lower bound. So are the statements of the introduction and of the proofs: the Hessian
    case of Theorem 1 (also in Guerra's compactly supported form, with the equivalence of the two
    forms), the uniqueness of the projection in Lemma 4, and Astala's higher integrability as a
    consequence of Corollary 2, with its sharpness. Not formalized: the extensions that the paper
    announces for later articles of the series, without precise statements, and the results that
    the paper cites only for context, among them the earlier upper bounds for the norm and the
    earlier quasiconvexity results under sign restrictions (docs/Agazzi/REPORT.md, Section 2).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

