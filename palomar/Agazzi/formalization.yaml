      lean: "AgazziChallenge.theorem1"
      module: "Agazzi.Challenge"
      status: "proved"
      note: "C^∞ periodic test maps, as in the paper."
    - source: "Corollary 2 (cor:Bp-BA), first assertion"
      lean: "AgazziChallenge.corollary2"
      module: "Agazzi.Challenge"
      status: "proved"
      note: "Every 1 < p < ∞, every A, C^∞ periodic test maps."
    - source: "Corollary 2 (cor:Bp-BA), second assertion (eq:BA-sharp-norm)"
      lean: "AgazziChallenge.corollary2_norm"
      module: "Agazzi.Challenge"
      status: "proved"
      note: "The norm on L^p(C;C) as the supremum over Schwartz functions."
    - source: "(eq:BA-sharp-norm), second equality"
      lean: "AgazziChallenge.pStar_sub_one_of_le_two"
      module: "Agazzi.Challenge"
      status: "proved"
      note: "p* − 1 = (p − 1)⁻¹ for 1 < p ≤ 2."
    - source: "(eq:BA-sharp-norm), second equality"
      lean: "AgazziChallenge.pStar_sub_one_of_two_le"
      module: "Agazzi.Challenge"
      status: "proved"
      note: "p* − 1 = p − 1 for p ≥ 2."
    - source: "Introduction, TeX line 268"
      lean: "AgazziChallenge.det_eq"
      module: "Agazzi.Challenge"
      status: "proved"
      note: "Compared theorem: det A = |a₊|² − |a₋|²."
    - source: "Introduction, TeX line 268"
      lean: "AgazziChallenge.opNorm_eq"
      module: "Agazzi.Challenge"
      status: "proved"
      note: "Compared theorem: the operator norm is |a₊| + |a₋|."
    - source: "Theorem 1, |Q| = 1"
      lean: "AgazziChallenge.volume_unitSquare"
      module: "Agazzi.Challenge"
      status: "proved"
      note: "Compared theorem: the unit square has measure 1."
    - source: "(eq:BA-definition)"
      lean: "AgazziChallenge.beurling_dzbar"
      module: "Agazzi.Challenge"
      status: "proved"
      note: "Compared theorem: S ∘ ∂_z̄ = ∂_z on Schwartz functions."

