version: "v0.4"

project:
  name: "Iwaniec's conjecture: the quasiconvexity of L and the L^p norm of the Beurling–Ahlfors transform (Agazzi et al., arXiv:2609.28311)"
  description: >-
    A formalization of A. Agazzi et al., Sharp higher integrability theory, Part I: the
    L^p-norm of the Beurling–Ahlfors transform (arXiv:2609.28311v2). With A z = a₊ z + a₋ z̄,
    the integrand L (A) = |a₊|² − |a₋|² for |a₊| + |a₋| ≤ 1 and 2|a₊| − 1 otherwise is
    quasiconvex on R^{2×2}: the integral over the torus of L (A + Dφ) − L (A) is nonnegative
    for every matrix A and every smooth (in fact every Lipschitz) periodic map φ (Theorem 1).


    Hence (Corollary 2) the Burkholder integrands B_p are quasiconvex for every 1 < p < ∞, and
    the norm of the Beurling–Ahlfors transform on L^p(C) is p* − 1, p* = max (p, p/(p − 1)):
    Iwaniec's conjecture of 1982. Also proved: the Hessian case of Theorem 1, the uniqueness of the
    projection in Lemma 4, and Astala's sharp higher integrability of quasiconformal maps as a
    consequence of Corollary 2, with its sharpness. The cited results that the paper uses are
    proved too (Kinderlehrer–Stampacchia, Baernstein–Montgomery-Smith, Guerra, Lehto); the results
    it cites only for context, such as the earlier upper bounds for the norm and the earlier
    quasiconvexity results, are not formalized.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

