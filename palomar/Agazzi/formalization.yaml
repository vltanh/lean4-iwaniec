      models: ["Claude Opus 5.5 (claude-opus-5-5)"]
      framework: "Claude Code 2.1.330 (Claude Agent SDK)"
      tool_setup: "The formalize-math-paper skill (github.com/vltanh/formalize-math-paper); a lead agent and ten sub-agents (statement review, seven provers in parallel, proof review, cleanup), each checking files against a private snapshot of the build."
      cost:
        wall_time: "about 1.6 hours elapsed from the start to the verified build; about 4.9 hours of sub-agent time (session transcripts)"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "A coordinating session gave the task; the lead followed the skill's phases and briefed the sub-agents."
  spend_usd: "not tracked"
  notes: "AI agents wrote the code and the checks; no person has reviewed the proofs."

fidelity:
  divergences: >-
    Statements: none changed. Readings: the torus as periodic maps on R² with integrals over the
    unit square; W^{1,∞}_per as Lipschitz periodic functions; the L² projection as a minimizer;
    the norm of the transform as the supremum over Schwartz functions. Theorem 1 and the first
    assertion of Corollary 2 are proved for Lipschitz periodic test maps, by the paper's
    arguments, and the paper's smooth statements follow. Proofs: every proof follows the
    paper's, except the upper bound for the norm, which passes from the torus to the plane by
    transference (Hytönen–van Neerven–Veraar–Weis, Cor. 5.7.6) instead of the planar cut-off
    argument of the cited sources (economy, not forced; for the user's decision). Gaps of the
    paper filled: the closedness of the constraint set in L²(Q), the periodization of the ball
    in Lemma 4, the sign change, the passage of the BMS arguments to periodic maps at every A.

