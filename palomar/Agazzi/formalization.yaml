  spend_usd: "not tracked"
  notes: "AI agents wrote the code and the checks; no person has reviewed the proofs."

fidelity:
  divergences: >-
    Statements: none changed. Readings: the torus as periodic maps on R² with integrals over the
    unit square; W^{1,∞}_per as Lipschitz periodic functions; the L² projection as a minimizer;
    the norm of the transform as the supremum over Schwartz functions. Theorem 1 and the first
    assertion of Corollary 2 are proved for Lipschitz periodic test maps, by the paper's
    arguments, and the paper's smooth statements follow. Proofs: every proof follows the
    paper's argument or, where the paper only cites, that of the cited sources. The upper bound
    for the norm follows Baernstein–Montgomery-Smith on the plane (Corollary 2 at A = 0 for
    compactly supported maps, Conjectures 2 and 3, remark (b)) and Guerra's passage to L^p(C),
    with its dense class C_c^∞, in the package HarmonicAnalysis. The one departure is forced: the
    gradient case (a complex g and its Cauchy transform) in place of Guerra's Hessian case (a real
    h and its logarithmic potential); Guerra's "by density", which presupposes the L^p-boundedness
    of the transform, is made by Fatou's lemma with the convergence of the Fourier transforms in
    L¹. A shorter proof of the upper bound, on the torus and by transference (Hytönen–van
    Neerven–Veraar–Weis, Cor. 5.7.6), is kept beside it and not used. Gaps of the paper
    filled: the closedness of the constraint set in L²(Q), the periodization of the ball in
    Lemma 4, the sign change, the passage of the BMS arguments to periodic maps at every A and
    back to the plane for the norm.

