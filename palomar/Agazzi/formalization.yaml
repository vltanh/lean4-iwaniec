    note: "The arguments by which the paper derives Corollary 2: the identities (1.2a), (1.2b), proved by direct integration; the inequality from Burkholder (1988), proved by the package BanachProbability; the passage from Conjecture 2 to Conjecture 3, and remark (b) (Conjecture 3 gives the norm), proved by Guerra's argument in the package HarmonicAnalysis. Its extremals f_α are, on the unit disc, the test functions of the lower bound."
