status:
  scope: >-
    Every numbered result of the paper is formalized and proved: Lemma 3, Lemma 4, Theorem 1
    (also for Lipschitz periodic test maps), Corollary 2 (both assertions), and every result
    the paper cites. Not formalized: the uniqueness of the projection in Lemma 4 (not needed),
    and the remarks of the introduction on consequences and generalizations.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (claude-opus-5-5)"]
      framework: "Claude Code 2.1.330 (Claude Agent SDK)"
      tool_setup: "The formalize-math-paper skill (github.com/vltanh/formalize-math-paper); a lead agent and ten sub-agents (statement review, seven provers in parallel, proof review, cleanup), each checking files against a private snapshot of the build. A second round (the planar proof of the upper bound, general code moved into the packages): a lead agent and six sub-agents, one per package task."
      cost:
        wall_time: "about 1.6 hours elapsed from the start to the verified build, and about 4.9 hours of sub-agent time; second round, about 1.7 hours elapsed and 1.2 hours of sub-agent time (session transcripts)"
        spend_usd: "not tracked"
        hardware: "local machine"
