status:
  scope: >-
    Every numbered result of the paper is formalized and proved: Lemma 3, Lemma 4, Theorem 1
    (also for Lipschitz periodic test maps), Corollary 2 (both assertions), and every result
    the paper cites. Not formalized: the uniqueness of the projection in Lemma 4 (not needed),
    and the remarks of the introduction on consequences and generalizations.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

