name = "Iwaniec"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Agazzi", "Palomar"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

# Quasiconvexity, periodic test maps, null Lagrangians, Hessian test functions.
[[require]]
name = "CalculusOfVariations"
git = "https://github.com/vltanh/lean4-calculus-of-variations"
rev = "a3778e447c557dd8eb81b84f47db4aa9ed0070d0"

# The Beurling–Ahlfors transform, Fourier multipliers, transference, Sobolev spaces, the Beltrami
# equation.
[[require]]
name = "HarmonicAnalysis"
git = "https://github.com/vltanh/lean4-harmonic-analysis"
rev = "4c9fb088fe3ed7452430f825730e3d23fa4d0a6a"

# Burkholder's function. Pinned at an older revision, which the HarmonicAnalysis pin above requires.
[[require]]
name = "BanachProbability"
git = "https://github.com/vltanh/lean4-banach-probability"
rev = "dc3966ce34fbc31b2936a0ca9b8a50356d690ae1"

[[lean_lib]]
name = "Agazzi"
globs = ["Agazzi.+"]

# Last: Lake gives a module to the last library whose patterns match it, and `Agazzi.+` also
# matches the Challenge and the Solution.
[[lean_lib]]
name = "Palomar"
srcDir = "palomar"
roots = ["Agazzi.Challenge", "Agazzi.Solution"]
